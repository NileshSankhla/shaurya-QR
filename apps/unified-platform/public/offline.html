<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#964900" />
    <title>Shaurya Operations · Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f9f9f9; color: #1a1c1c; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #ddc1b1; border-radius: 28px; background: #fff; text-align: center; box-shadow: 0 18px 55px rgb(83 45 20 / 12%); }
      img { width: 108px; height: 108px; object-fit: contain; padding: 8px; border-radius: 26px; background: #1a1c1c; }
      h1 { margin: 22px 0 8px; font-size: 1.6rem; }
      p { margin: 0; color: #564337; line-height: 1.55; }
      button { margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 22px; background: linear-gradient(135deg, #f58529, #8639b4); color: white; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f58529; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Shaurya keeps protected operational data online-only. Reconnect to assign QR cards or verify food.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
